[package]
name = "hotswap"
version = "0.1.0"
edition = "2021"
description = "Zero-downtime config & env reloader — watch files, validate, and signal processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niklasmarderx/hotswap"
readme = "README.md"
keywords = ["config", "reload", "watch", "env", "signal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
notify-debouncer-full = "0.5"
nix = { version = "0.29", features = ["signal", "process"] }
dotenvy = "0.15"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
glob = "0.3"
sysinfo = "0.33"
anyhow = "1"
chrono = "0.4"
