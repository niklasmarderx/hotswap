[package]
name = "hotswap"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Zero-downtime config & env reloader — watch files, validate, diff, and signal processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niklasmarderx/hotswap"
homepage = "https://github.com/niklasmarderx/hotswap"
readme = "README.md"
keywords = ["reload", "watch", "signal", "config", "env"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/**", "assets/**"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
notify-debouncer-full = "0.5"
nix = { version = "0.29", features = ["signal", "process"] }
dotenvy = "0.15"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
glob = "0.3"
sysinfo = "0.33"
anyhow = "1"
chrono = "0.4"
clap_complete = "4"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
